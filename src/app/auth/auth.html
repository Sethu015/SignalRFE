<div class="row">
    <div class="col-xl-2 offset-xl-5 col-lg-4 offset-lg-4 col-6 offset-3">
        <form #authForm="ngForm" (ngSubmit)="onSubmit(authForm)">
            <div class="row">
                <div class="col-10 offset-1">
                    <div class="form-group">
                        <label for="userName">userName</label>
                        <input type="username" name="userName" ngModel class="form-control" id="userName">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-10 offset-1">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" name="password" ngModel class="form-control" id="password">
                    </div>
                </div>
            </div>

            <div class="row" style="margin-bottom: 10px;">
                <div class="col-1 offset-1">
                    <button type="submit" class="btn btn-primary" [disabled]="!authForm.valid">Login</button>
                </div>
            </div>

        </form>
    </div>
</div>
